<html lang="en"><head><meta charset="utf-8">

<title>Smart Explorer &amp; Lab</title>
<style>
:root{--bg:#070b19;--tx:#e8ecff;--ac:#4cc9f0;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:0 0 24px rgba(76,201,240,.14)}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 4px;background:linear-gradient(var(--bg) 55%,transparent)}
.logo{font-weight:700;font-size:16px;letter-spacing:.4px;text-shadow:0 0 14px var(--ac)}.logo b{color:var(--ac)}
.row{display:flex;gap:6px;overflow-x:auto;padding:6px 0 0;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
button{font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:#04101f;border-color:var(--ac);box-shadow:0 0 14px var(--ac)}
#ctl{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 118px);display:flex;flex-direction:column;gap:6px}
#ctl button{font-size:12px;padding:6px 10px}
#info{position:fixed;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;padding:10px 14px;border-radius:16px;max-height:38vh;overflow:auto}
#info h3{margin:0 0 2px;font-size:15px;color:var(--ac)}#info p{margin:0}
ul{margin:8px 0 0;padding-left:18px}li{margin:3px 0}
#nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;display:flex;gap:4px;border-radius:18px;padding:4px}
#nav button{flex:1;border:0;background:none;border-radius:14px;padding:9px 2px;font-size:12px}
#nav button.on{background:var(--ac)}
</style></head><body>
